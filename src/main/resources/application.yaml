
spring:
  application:
    name: ms-usuarios

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true
