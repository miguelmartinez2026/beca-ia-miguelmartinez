
spring:
  application:
    name: ms-usuarios

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  jackson:
    deserialization:
      fail-on-unknown-properties: true

seguridad:
  jwt:
    # Base64 estándar; al decodificar debe tener al menos 32 bytes. Sin valor por defecto.
    secret: ${JWT_SECRET}
    issuer: ms-usuarios
    expiracion-segundos: 3600

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
