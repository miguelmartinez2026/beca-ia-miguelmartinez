
name: ci-miguel

on:
  push:
    branches: ["practica-*"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Quality gates y pruebas (mvn verify)
        run: chmod +x mvnw && ./mvnw -B verify
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
